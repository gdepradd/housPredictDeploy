name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # Robot akan bekerja setiap kali kamu push ke branch main

env:
  # GANTI 'gdepradd' dengan USERNAME DOCKER HUB KAMU yang asli!
  DOCKER_USER: gdepradd 

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil semua kode teks dari repositori GitHub
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Login otomatis ke Docker Hub menggunakan brankas rahasia
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Masak Image Backend dan unggah ke Cloud Docker Hub
    - name: Build and Push Backend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.api
        push: true
        tags: ${{ env.DOCKER_USER }}/mlops-backend:latest

    # 4. Masak Image Frontend dan unggah ke Cloud Docker Hub
    - name: Build and Push Frontend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.st
        push: true
        tags: ${{ env.DOCKER_USER }}/mlops-frontend:latest