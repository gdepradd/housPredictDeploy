version: '3.8'

services:
  # --- Service 1: Backend (FastAPI + Model) ---
  backend:
    image: image-backend      # Menggunakan image yang tadi kamu build
    container_name: mlops-backend
    ports:
      - "8000:8000"           # Port API
    volumes:
      - ./mlruns:/app/mlruns  # Agar container bisa baca model di folder mlruns
    environment:
      - MLFLOW_TRACKING_URI=file:///app/mlruns

  # --- Service 2: Frontend (Streamlit) ---
  frontend:
    image: image-frontend     # Menggunakan image frontend
    container_name: mlops-frontend
    ports:
      - "8501:8501"           # Port Web App
    environment:
      # KUNCI: Frontend menembak ke hostname 'backend', bukan localhost
      - API_URL=http://backend:8000/predict
    depends_on:
      - backend               # Frontend menunggu backend nyala dulu